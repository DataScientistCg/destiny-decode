# Deploy Lovable / TanStack Start app to GitHub Pages

name: Deploy static content to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Show build output
        run: |
          echo "=== .output/public ==="
          find .output/public -maxdepth 3 -type f | sort

      - name: Prepare Pages
        run: |
          mkdir -p pages
          cp -R .output/public/. pages/

          if [ -f "pages/_shell.html" ]; then
            cp pages/_shell.html pages/index.html
            cp pages/_shell.html pages/404.html
          elif [ -f "pages/index.html" ]; then
            cp pages/index.html pages/404.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./pages"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
