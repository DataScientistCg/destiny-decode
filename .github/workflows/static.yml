# Deploy Lovable / TanStack Start app to GitHub Pages

name: Deploy static content to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Prepare GitHub Pages
        run: |
          mkdir -p ./pages
          if [ -f "./.output/public/index.html" ]; then
            cp -R ./.output/public/. ./pages/
          elif [ -f "./dist/index.html" ]; then
            cp -R ./dist/. ./pages/
          else
            echo "ERROR: No index.html found in build output"
            echo "=== .output/public ==="
            find ./.output/public -maxdepth 3 -type f 2>/dev/null | sort || true
            echo "=== dist ==="
            find ./dist -maxdepth 3 -type f 2>/dev/null | sort || true
            exit 1
          fi

      - name: Add SPA fallback
        run: |
          if [ -f "./pages/index.html" ]; then
            cp ./pages/index.html ./pages/404.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./pages"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
